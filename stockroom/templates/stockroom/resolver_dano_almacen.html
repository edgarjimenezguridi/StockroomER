<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Resolver piezas dañadas | StockroomER</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 24px 16px;
            background: #f0f5fa;
            color: #172335;
            font-family: Arial, sans-serif;
        }
        main {
            max-width: 720px;
            margin: auto;
            padding: 28px;
            background: white;
            border-radius: 16px;
        }
        a { color: #195578; }
        select, input, textarea {
            display: block;
            width: 100%;
            max-width: 100%;
            margin-top: 6px;
            padding: 12px;
            border: 1px solid #94a3b8;
            border-radius: 8px;
            font-size: 16px;
        }
        button {
            padding: 14px 22px;
            border: 0;
            border-radius: 8px;
            background: #195578;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }
        .errorlist { color: #a31919; }
        .mensaje { padding: 12px; background: #e7f5e9; }
    </style>
</head>
<body>
    <main>
        <a href="{% url 'panel_almacen' %}">← Volver al panel</a>

        <h1>Resolver piezas dañadas</h1>

        {% for message in messages %}
            <p class="mensaje" role="status">{{ message }}</p>
        {% endfor %}

        <p>
            Registra si las piezas dañadas se recuperaron o se dieron
            de baja. La cantidad no puede superar lo pendiente por resolver.
        </p>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Guardar resolución</button>
        </form>
    </main>
</body>
</html>
