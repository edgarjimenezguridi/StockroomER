
{% load static %}
<!DOCTYPE html>
<html lang="es-MX">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Escanear comanda | StockroomER</title>

    <link
        rel="stylesheet"
        href="{% static 'stockroom/css/empresa.css' %}"
    >

    <style>
        body {
            margin: 0;
            padding: 24px;
            background: #f1f5f9;
            color: #172335;
            font-family: Arial, sans-serif;
        }

        main {
            max-width: 650px;
            margin: 48px auto;
            padding: 40px;
            background: white;
            border-radius: 18px;
        }

        .encabezado-empresa {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 18px;
            margin-bottom: 28px;
        }

        .encabezado-empresa .logo-empresa {
            width: 420px;
            max-width: 100%;
            height: auto;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 36px;
        }

        .descripcion {
            margin: 0;
            color: #526174;
            line-height: 1.5;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            padding: 14px;
            font-size: 20px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
        }

        input:focus {
            outline: 2px solid #169c21;
            outline-offset: 1px;
        }

        .errorlist {
            color: #b91c1c;
        }

        .acciones {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 24px;
        }

        @media (max-width: 600px) {
            body {
                padding: 12px;
            }

            main {
                margin: 16px auto;
                padding: 24px;
            }

            h1 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>
    <main>

        <div class="encabezado-empresa">
            <img
                src="{% static 'img/logo_empresa.png' %}"
                alt="Engranes y Rectificado"
                class="logo-empresa"
            >

            <div>
                <h1>Escanear comanda</h1>

                <p class="descripcion">
                    Escanea el código o escribe el folio impreso.
                </p>
            </div>
        </div>

        <form method="post">
            {% csrf_token %}

            {{ form.as_p }}

            <div class="acciones">
                <button
                    type="submit"
                    class="boton-empresa"
                >
                    Abrir solicitud
                </button>

                <a
                    href="{% url 'panel_almacen' %}"
                    class="boton-empresa boton-empresa-secundario"
                >
                    ← Regresar al inicio
                </a>
            </div>
        </form>

    </main>
</body>
</html>
