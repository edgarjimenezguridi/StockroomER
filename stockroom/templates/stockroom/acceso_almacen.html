<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Acceso al almacén | StockroomER</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 32px 16px;
            background: #f0f5fa;
            color: #172335;
            font-family: Arial, sans-serif;
        }
        main {
            max-width: 480px;
            margin: 40px auto;
            padding: 32px;
            border-radius: 20px;
            background: white;
        }
        h1 { margin-top: 0; }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #94a3b8;
            border-radius: 8px;
            font-size: 18px;
        }
        button {
            width: 100%;
            margin-top: 16px;
            padding: 16px;
            border: 0;
            border-radius: 8px;
            background: #195578;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }
        .errorlist {
            color: #a31919;
            padding-left: 20px;
        }
    </style>
</head>
<body>
    <main>
        <h1>Acceso al almacén</h1>
        <p>Ingresa con tu usuario y contraseña de almacenista.</p>

        <form method="post">
            {% csrf_token %}
            {{ form.non_field_errors }}

            <p>
                {{ form.username.label_tag }}
                {{ form.username }}
                {{ form.username.errors }}
            </p>

            <p>
                {{ form.password.label_tag }}
                {{ form.password }}
                {{ form.password.errors }}
            </p>

            <button type="submit">Entrar al almacén</button>
        </form>
    </main>
</body>
</html>
